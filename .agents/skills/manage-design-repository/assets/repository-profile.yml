schema_version: 2
project_name: "PROJECT_NAME"
language: "PROJECT_LANGUAGE"

records:
  backlog: "tasks"
  workspace_map: ".design-workflow/workspace-map.md"
  project_rules: ".design-workflow/project-rules.md"
  templates: ".design-workflow/templates"
  navigation: ["README.md", ".design-workflow/workspace-map.md"]

classes:
  design:
    dir: "design-docs"
    type: Design
    required: []
  inspiration:
    dir: "inspirations"
    type: Inspiration
    required: [status, scope, related, created]
    optional: [updated]
    status: [New, Adopted, Rejected]
  issue:
    dir: "inspirations"
    type: Issue
    required: [status, related, created]
    optional: [updated]
    status: [Open, Resolved, Dropped]
  term:
    dir: "glossary"
    type: Term
    required: [location]
  example:
    dir: "design-examples"
    type: Example
    required: [status, related]
    status: [Stub, Draft, Done]
  research:
    dir: "research"
    type: Research
    required: []
  task:
    dir: "tasks"
    type: Task
    required: [status, related, created]
    optional: [owner]
    status: [Open, Doing]

fields:
  scope:
    values: [System, Content]
  related:
    kind: links
  location:
    kind: link
  created:
    kind: date
  updated:
    kind: date
  owner:
    kind: text

ignore:
  keys: [aliases, tags]
  dirs: []

images:
  dirs: ["references"]
  formats: [webp, jpg, jpeg, svg, gif]
  max_edge: 2560
  max_kb: 1500
  quality: 90
  manifest: "images.yml"
  status: [Unreviewed, Pick, Reject, Reference]
  default_status: Unreviewed
  bad_names: ['^[0-9A-Fa-f]{32}$', '^image[0-9]*$', '^Pasted image', '^Screenshot']

adapters: []

collaboration:
  formal_design_changes: direct

integrations:
  external_spec_bridge: false
