# Image manifest: one record per image, keyed by its path relative to this file.
# Checked by `vault.py lint`. `vault.py images` adds records for new images.
images:
  "怪物/butcher.webp":
    status: Reference
    for: []
    note: "彩色厚涂。披毛皮、穿重甲的巨型屠夫蹲坐在头颅堆上，身上挂着提灯，背景是火光和掩面的人。"
  "怪物/butcher1.webp":
    status: Reference
    for: []
    note: "与上一张同构图的棕褐色线稿版，用排线和有限色阶表现毛皮、盔甲和头颅。"
  "纹路/密集排线背景与斗篷褶皱.webp":
    status: Reference
    for: []
    note: "黑白漫画分格。披斗篷的剑士，背景铺满方向一致的短排线，斗篷褶皱用粗黑线和留白表现。"
  "风格/linework.webp":
    status: Reference
    for: []
    note: "青绿底色上的肌肉人体背影，深色块面加红色顺形线条，线条沿肌肉走向排列。"
  "风格/linework2.webp":
    status: Reference
    for: []
    note: "黑白漫画跨页。披甲剑士挥出大剑，密集的平行速度线构成剑的轨迹，边缘带暗红。"
  "风格/style.webp":
    status: Reference
    for: []
    note: "黑白漫画分格。低垂的头部特写，头发用粗细变化的长线表现，大面积纯黑与留白对比。"
  "风格/排线-山坡古树与草地.webp":
    status: Reference
    for: []
    note: "黑白钢笔画。岩石山坡上的古树、草地与远处平原，天空留白，云只用轮廓和少量弧线。"
  "风格/排线-巴洛克大门与云.webp":
    status: Reference
    for: []
    note: "黑白钢笔画。繁复的巴洛克石门立在水边，背后是用层叠圆弧和等粗短线画出的积云。"
  "风格/淡彩-漂浮的遗迹碎块.webp":
    status: Reference
    for: []
    note: "墨线加淡彩。一块带拱门和石板地面的建筑残片悬在空中，旁边有一个坠落的小人。"
  "风格/淡彩-石像与红披风人物.webp":
    status: Reference
    for: []
    note: "墨线加淡彩。一尊高举手臂的石像，一人被弹开，前景是披红色披风的人物。只有披风上色。"
  "风格/淡彩-石巨人与旅人.webp":
    status: Reference
    for: []
    note: "彩色插画。匍匐的石质巨人与披斗篷的旅人对视，蓝天、白云和蓝色花丛。视频截图，带平台水印。"
  "风格/漫画-写实灰调分镜.webp":
    status: Reference
    for: []
    note: "条漫的手机截图。接近照片质感的灰调分格：提箱的人物、成排的头颅、远处的行人。"
  "风格/漫画-坠入天空的橙紫配色.webp":
    status: Reference
    for: []
    note: "彩色条漫的手机截图。人物向紫色天空坠落，下方是橙黄色的强光，配色只用橙、黄、紫三组。"
  "风格/漫画-巨口中的人影.webp":
    status: Reference
    for: []
    note: "彩色条漫的手机截图。布满牙齿的圆形巨口，中央白光里悬着一个人影。"
  "风格/漫画-废墟城市远景排线.webp":
    status: Reference
    for: []
    note: "黑白漫画的城市远景。楼群上方是一团用细碎线条画出的巨大云状体。视频截图，带字幕和水印。"
  "风格/漫画-肌肉人物与放射线.webp":
    status: Reference
    for: []
    note: "黑白漫画。正面站立的肌肉人物，背景是向外扩散的放射线和高光。视频截图，带平台水印。"
  "风格/漫画-面部特写与重排线.webp":
    status: Reference
    for: []
    note: "黑白漫画的面部特写，用密集的交叉排线塑造阴影和压迫感。视频截图，带平台水印。"
